apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: artie-kafka
  namespace: kafka
spec:
  # Needed for the User Operator, which manages the KafkaUser in user_operator.yaml.
  entityOperator:
    topicOperator: {}
    userOperator: {}
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    listeners:
      - name: internal
        port: 9093
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      auto.create.topics.enable: true
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      allow.everyone.if.no.acl.found: false
      delete.topic.enable: true
      log.retention.hours: 24
      message.max.bytes: 15728640
      # offsets.retention.minutes is left at the 7-day default, so a stopped consumer keeps its position.
    jmxOptions: {}
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    resources:
      requests:
        memory: "64Mi"
        cpu: "200m"
      limits:
        memory: "128Mi"
        cpu: "500m"
    showAllOffsets: false
