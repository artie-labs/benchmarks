# Kafka Connect running Debezium (Postgres source) and the Snowflake connector v4 (Snowpipe Streaming sink).
# Requires Strimzi 1.x, which serves only kafka.strimzi.io/v1.
#
# Strimzi builds the image from spec.build and pushes it to spec.build.output.image. Create the push secret first:
#   kubectl create secret docker-registry dockerhub-credentials -n kafka \
#     --docker-server=https://index.docker.io/v1/ --docker-username=<user> --docker-password=<token>
# https://strimzi.io/docs/operators/latest/deploying#creating-new-image-using-kafka-connect-build-str
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  # Must be a version the operator supports (Strimzi 1.3.1: 4.2.0 to 4.3.2). Matches the brokers.
  # Debezium 3.7.1 is built against Connect 4.3.1. Snowflake connector 4.4.0 is built against the Connect API 3.9 and
  # Snowflake only says later versions are "untested". Its jar bundles kafka-clients 3.9.2, but Connect loads
  # org.apache.kafka.* from the runtime, not the plugin, so it runs on the 4.3.1 clients.
  version: 4.3.1
  replicas: 1
  bootstrapServers: artie-kafka-kafka-bootstrap.kafka.svc.cluster.local:9093
  authentication:
    type: scram-sha-512
    username: artie
    passwordSecret:
      secretName: kafka-secret
      password: KAFKA_SCRAM_PASSWORD
  groupId: connect-cluster
  configStorageTopic: connect-cluster-configs
  offsetStorageTopic: connect-cluster-offsets
  statusStorageTopic: connect-cluster-status
  # Explicit, so the benchmark can report what Connect had. No CPU limit, like the Artie snapshot pod.
  resources:
    requests:
      cpu: 500m
      memory: 3Gi
    limits:
      memory: 3Gi
  # Snowflake recommends about 50% of memory for the heap: the Snowpipe Streaming SDK allocates off-heap.
  jvmOptions:
    -Xms: 1536m
    -Xmx: 1536m
  config:
    config.providers: file
    config.providers.file.class: org.apache.kafka.common.config.provider.FileConfigProvider
    # Debezium keys are structs, so they need the JSON converter too.
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    # Schemas on, so the Snowflake connector creates typed columns (NUMBER for aid, bid, abalance) instead of
    # inferring them.
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: true
    offset.flush.interval.ms: 10000
  build:
    output:
      type: docker
      image: artielabs/kafka-connect-snowflake:0.2.0
      pushSecret: dockerhub-credentials
    plugins:
      - name: debezium-postgres-connector
        artifacts:
          - type: tgz
            url: https://repo1.maven.org/maven2/io/debezium/debezium-connector-postgres/3.7.1.Final/debezium-connector-postgres-3.7.1.Final-plugin.tar.gz
            sha512sum: d118c8eb994153c9cb687ee9071d09d07b5a03aafc03f5d898bd8ffa86ba801342be30723736f8d2803ae4a708a33295335f54d9f1af99d8c348461579a85868
      - name: snowflake-connector
        artifacts:
          # The connector jar is a fat jar. Pulling it as type maven would also copy its compile dependencies
          # (kafka-clients 3.9.2 among them) into the plugin directory, so each jar is fetched directly.
          - type: jar
            url: https://repo1.maven.org/maven2/com/snowflake/snowflake-kafka-connector/4.4.0/snowflake-kafka-connector-4.4.0.jar
            sha512sum: 0a6996ae95656fc9243729b2dc6714686c64ded8c0c29423734054b2717259bc026d45be0cde91f5a9fd9aa51edcf929b29c39936e3ceb2ce95fbd9cfee57fba
          # Bouncy Castle FIPS, needed to read the encrypted private key. The connector declares bcpkix-fips 2.1.12
          # as provided; bcpkix-fips needs bcutil-fips [2.1.7,2.2.0) and bc-fips [2.1.0,2.2.0).
          - type: jar
            url: https://repo1.maven.org/maven2/org/bouncycastle/bc-fips/2.1.2/bc-fips-2.1.2.jar
            sha512sum: c20da957f38fc09b7fc6def8afe9c9f4137a8de56d8d602719be6e1eb7ea0d2dface092bdf0a16d2a178eb57078553e53db60fbbcda166038cddb0a22087f69b
          - type: jar
            url: https://repo1.maven.org/maven2/org/bouncycastle/bcutil-fips/2.1.8/bcutil-fips-2.1.8.jar
            sha512sum: 1a0955460fe1a3f926c2081a93410543a3f4913742816a1dcd85609b3281d79baddf3984cbeac609cdd2b1efc61695c4c392e955a669db2824dafd572e9dfbd5
          - type: jar
            url: https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-fips/2.1.12/bcpkix-fips-2.1.12.jar
            sha512sum: 7da951cd570b6bf1b66c398c2de52623f162ff8ce57cf82e5f7e3f31e332809e242aa7f94a8f79a8406cdec38b3365c6458c11a489f32fb1c310a5610659a3fa
  template:
    pod:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/instance-type
                    operator: In
                    values:
                      - m8i.2xlarge
      volumes:
        - name: postgres-config
          secret:
            secretName: postgres-credentials
        - name: snowflake-config
          secret:
            secretName: snowflake-credentials
    connectContainer:
      volumeMounts:
        - name: postgres-config
          mountPath: /mnt/postgres-config
        - name: snowflake-config
          mountPath: /mnt/snowflake-config
---
# https://debezium.io/documentation/reference/3.7/connectors/postgresql.html
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: postgres-source-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: connect
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  # The Postgres connector only ever runs one task.
  tasksMax: 1
  autoRestart:
    enabled: true
  config:
    database.hostname: "${file:/mnt/postgres-config/postgres.properties:hostname}"
    database.port: 5432
    database.dbname: postgres
    database.user: "${file:/mnt/postgres-config/postgres.properties:username}"
    database.password: "${file:/mnt/postgres-config/postgres.properties:password}"
    database.sslmode: require
    topic.prefix: dbserver1
    table.include.list: public.pgbench_accounts
    plugin.name: pgoutput
    slot.name: debezium
    # run/bench.sh creates dbz_publication FOR TABLE public.pgbench_accounts after pgbench -i (Artie uses it too).
    # Fail rather than create a FOR ALL TABLES publication if it's missing.
    publication.name: dbz_publication
    publication.autocreate.mode: disabled
    # Stream from the slot's creation point. The default (initial) would first snapshot all 100M rows through a
    # single task before streaming anything.
    snapshot.mode: no_data
    # Flatten the change event to the row (aid, bid, abalance, filler) plus __op, __lsn and __source_ts_ms, so the
    # Snowflake table gets one column per field and the latency queries can read FILLER. Deletes become a row with
    # __deleted = true, and no tombstone is sent.
    transforms: unwrap
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.add.fields: op,lsn,source.ts_ms
    transforms.unwrap.delete.tombstone.handling.mode: rewrite
---
# Snowflake connector v4: Snowpipe Streaming (high-performance architecture) only, append-only.
# https://docs.snowflake.com/en/user-guide/kafka-connector/setup-kafka
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: snowflake-sink-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: connect
spec:
  class: com.snowflake.kafka.connector.SnowflakeStreamingSinkConnector
  # The Debezium topic has one partition (broker default), so more tasks would sit idle.
  tasksMax: 1
  autoRestart:
    enabled: true
  config:
    topics: dbserver1.public.pgbench_accounts
    # Created by the connector on first write. run/sql/setup.sql turns on ROW_TIMESTAMP_DEFAULT for the schema
    # first, so the table gets METADATA$ROW_LAST_COMMIT_TIME like the Artie and DMS tables.
    snowflake.topic2table.map: "dbserver1.public.pgbench_accounts:DEBEZIUM_HISTORY"
    snowflake.url.name: "${file:/mnt/snowflake-config/snowflake.properties:account}.${file:/mnt/snowflake-config/snowflake.properties:region}.snowflakecomputing.com:443"
    snowflake.user.name: "${file:/mnt/snowflake-config/snowflake.properties:username}"
    snowflake.private.key: "${file:/mnt/snowflake-config/snowflake.properties:private_key}"
    snowflake.private.key.passphrase: "${file:/mnt/snowflake-config/snowflake.properties:private_key_passphrase}"
    snowflake.database.name: "${file:/mnt/snowflake-config/snowflake.properties:database}"
    snowflake.schema.name: "${file:/mnt/snowflake-config/snowflake.properties:schema}"
    snowflake.role.name: "${file:/mnt/snowflake-config/snowflake.properties:role}"
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: true
    # One column per field (the v4 default, set explicitly). Upper-case the column names, so Debezium's aid and
    # filler become AID and FILLER, as in the other tools' tables.
    snowflake.enable.schematization: true
    snowflake.compatibility.enable.column.identifier.normalization: true
    # A new install, not a migration from v3: skip the check for configs copied from the classic connector.
    snowflake.streaming.validate.compatibility.with.classic: false
