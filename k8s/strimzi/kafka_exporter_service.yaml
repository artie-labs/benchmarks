apiVersion: v1
kind: Service
metadata:
  name: kafka-exporter-service # kubeDNS assigns this to kafka-exporter-service.kafka.svc.cluster.local
  namespace: kafka
spec:
  selector:
    strimzi.io/name: artie-kafka-kafka-exporter
  ports:
    - protocol: TCP
      port: 80
      targetPort: 9404
  type: ClusterIP
